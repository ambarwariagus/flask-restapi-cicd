<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Registration CRUD</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { background: #f4f7fb; color: #172033; margin: 0; }
    main { margin: 3rem auto; max-width: 960px; padding: 0 1rem; }
    h1 { margin-bottom: .3rem; }
    .subtitle { color: #526074; margin-top: 0; }
    .grid { display: grid; gap: 1.5rem; grid-template-columns: minmax(260px, 340px) 1fr; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px #1720331a; padding: 1.25rem; }
    label { display: block; font-weight: 700; margin-top: .85rem; }
    input { border: 1px solid #bcc7d8; border-radius: 6px; box-sizing: border-box; font: inherit; margin-top: .35rem; padding: .65rem; width: 100%; }
    button { background: #1769e0; border: 0; border-radius: 6px; color: #fff; cursor: pointer; font: inherit; margin-top: 1rem; padding: .65rem 1rem; }
    button:hover { background: #0f55b9; }
    button.secondary { background: #64748b; margin-left: .5rem; }
    button.danger { background: #c53636; margin: 0; padding: .4rem .6rem; }
    button.edit { margin: 0 .4rem 0 0; padding: .4rem .6rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #e1e7f0; padding: .75rem .45rem; text-align: left; }
    th { color: #526074; font-size: .85rem; }
    .message { border-radius: 6px; display: none; margin: 1rem 0; padding: .75rem; }
    .message.error { background: #fee2e2; color: #991b1b; }
    .message.success { background: #dcfce7; color: #166534; }
    .empty { color: #526074; text-align: center; }
    .links { margin-top: 1.25rem; }
    .links a { color: #1769e0; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } table { font-size: .85rem; } }
  </style>
</head>
<body>
  <main>
    <h1>User Registration CRUD</h1>
    <p class="subtitle">Frontend sederhana untuk demo RESTful API Flask.</p>
    <div id="message" class="message" role="alert"></div>

    <section class="grid">
      <form id="user-form" class="card">
        <h2 id="form-title">Tambah User</h2>
        <label for="api-key">API Key</label>
        <input id="api-key" type="password" value="my-secret-api-key-123" required>
        <label for="username">Username</label>
        <input id="username" type="text" minlength="3" maxlength="50" required>
        <label for="email">Email</label>
        <input id="email" type="email" required>
        <label for="full-name">Nama Lengkap</label>
        <input id="full-name" type="text" maxlength="100" required>
        <button id="submit-button" type="submit">Simpan</button>
        <button id="cancel-button" class="secondary" type="button" hidden>Batal</button>
      </form>

      <section class="card">
        <h2>Daftar User</h2>
        <table>
          <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Nama</th><th>Aksi</th></tr></thead>
          <tbody id="user-list"><tr><td colspan="5" class="empty">Memuat data...</td></tr></tbody>
        </table>
      </section>
    </section>
    <p class="links"><a href="/docs">Swagger API Docs</a> · <a href="/health">Health Check</a></p>
  </main>

  <script>
    const form = document.querySelector('#user-form');
    const list = document.querySelector('#user-list');
    const message = document.querySelector('#message');
    const cancelButton = document.querySelector('#cancel-button');
    const submitButton = document.querySelector('#submit-button');
    const formTitle = document.querySelector('#form-title');
    let editingId = null;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
      message.style.display = 'block';
    }

    function escapeHtml(value) {
      const element = document.createElement('span');
      element.textContent = value;
      return element.innerHTML;
    }

    function resetForm() {
      editingId = null;
      form.reset();
      document.querySelector('#api-key').value = 'my-secret-api-key-123';
      formTitle.textContent = 'Tambah User';
      submitButton.textContent = 'Simpan';
      cancelButton.hidden = true;
    }

    function headers() {
      return {
        'Content-Type': 'application/json',
        'X-API-KEY': document.querySelector('#api-key').value
      };
    }

    async function loadUsers() {
      const response = await fetch('/api/');
      const users = await response.json();
      if (!users.length) {
        list.innerHTML = '<tr><td colspan="5" class="empty">Belum ada user.</td></tr>';
        return;
      }
      list.innerHTML = users.map((user) => `
        <tr>
          <td>${user.id}</td><td>${escapeHtml(user.username)}</td><td>${escapeHtml(user.email)}</td><td>${escapeHtml(user.full_name)}</td>
          <td><button class="edit" data-id="${user.id}">Edit</button><button class="danger" data-id="${user.id}">Hapus</button></td>
        </tr>`).join('');
      document.querySelectorAll('.edit').forEach((button) => button.addEventListener('click', () => editUser(users.find((user) => user.id === Number(button.dataset.id)))));
      document.querySelectorAll('.danger').forEach((button) => button.addEventListener('click', () => deleteUser(button.dataset.id)));
    }

    function editUser(user) {
      editingId = user.id;
      document.querySelector('#username').value = user.username;
      document.querySelector('#email').value = user.email;
      document.querySelector('#full-name').value = user.full_name;
      formTitle.textContent = `Edit User #${user.id}`;
      submitButton.textContent = 'Update';
      cancelButton.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function errorMessage(response, fallback) {
      const body = await response.json().catch(() => ({}));
      return `HTTP ${response.status}: ${body.message || fallback}`;
    }

    async function deleteUser(id) {
      if (!confirm('Hapus user ini?')) return;
      const response = await fetch(`/api/${id}`, { method: 'DELETE', headers: headers() });
      if (!response.ok) return showMessage(await errorMessage(response, 'Gagal hapus user.'), 'error');
      showMessage('User dihapus.', 'success');
      await loadUsers();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        username: document.querySelector('#username').value,
        email: document.querySelector('#email').value,
        full_name: document.querySelector('#full-name').value
      };
      const url = editingId ? `/api/${editingId}` : '/api/';
      const method = editingId ? 'PUT' : 'POST';
      const response = await fetch(url, { method, headers: headers(), body: JSON.stringify(payload) });
      if (!response.ok) return showMessage(await errorMessage(response, 'Gagal menyimpan user.'), 'error');
      showMessage(editingId ? 'User diperbarui.' : 'User ditambahkan.', 'success');
      resetForm();
      await loadUsers();
    });

    cancelButton.addEventListener('click', resetForm);
    loadUsers().catch(() => showMessage('Gagal memuat data user.', 'error'));
  </script>
</body>
</html>
