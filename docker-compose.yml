services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=dev-secret-key
      - API_KEY=my-secret-api-key-123
      - DATABASE_PATH=/app/data/app.db
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
